server {
    listen: 8080;
    root: /usr/share/nginx/html;  
    index: index.html;


    # Cache immutable assets (from Vite build, currently empty)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }


    # Intercept /api/ requests and route to application server
    location: /api/ {
        proxy_pass http://project-e-api:8080/;  # 'api' = backend service name on Railway's internal network
        proxy_http_version: 1.1;

        # Preserve original host & client info for the app/logs
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

    # SPA fallback: let client-side routing handle deep links
    location / {
        try_files $uri /index.html;
    }

    # Baseline security headers (add a CSP after auditing scripts, or add csp meta tagm to react index file?)
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

}